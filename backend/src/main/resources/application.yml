spring:
  application:
    name: crea-tech-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crea_tech_hub}
    username: ${DB_USERNAME:crea}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  recovery:
    url: ${RECOVERY_URL:}
    from: ${RECOVERY_MAIL_FROM:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 20m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    version: OPENAPI_3_1
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    csrf:
      enabled: true
      header-name: X-CSRF-TOKEN
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  override-with-generic-response: false
  writer-with-order-by-keys: true
