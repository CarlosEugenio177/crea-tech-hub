name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting (Spotless)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Check formatting
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

  static-analysis:
    name: Static analysis (SpotBugs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Run SpotBugs
        run: ./mvnw --batch-mode --no-transfer-progress compile spotbugs:spotbugs spotbugs:check -DskipTests

  test:
    name: Tests and coverage (JaCoCo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Run tests and verify coverage
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Set up Node.js for API contract checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openapi/package-lock.json

      - name: Verify generated OpenAPI types
        working-directory: openapi
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Validate frontend against the API contract
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: |
          npm ci
          node -e "require('node:fs').copyFileSync('../openapi/schema.d.ts', 'src/shared/api/schema.d.ts')"
          npm run check
          git diff --exit-code -- src/shared/api/schema.d.ts

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-${{ github.sha }}
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build JAR (Maven)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [format, static-analysis, test]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Package JAR
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload validated JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
