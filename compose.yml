name: crea-tech-hub

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_DB: crea_tech_hub
      POSTGRES_USER: crea
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD para o banco local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crea -d crea_tech_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
