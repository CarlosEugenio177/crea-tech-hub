openapi: 3.1.0
info:
  title: Crea Tech Hub - API administrativa
  version: provisional
  description: >
    Contrato provisório transcrito dos controllers do backend. Deve ser substituído
    pelo documento OpenAPI publicado pelo backend quando ele existir.
paths:
  /api/v1/admin/auth/csrf:
    get:
      operationId: getCsrfToken
      responses:
        '200':
          description: Token CSRF da sessão atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Sessão iniciada.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Sessão encerrada.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/auth/me:
    get:
      operationId: getCurrentAdmin
      responses:
        '200':
          description: Conta administrativa autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Senha alterada. As sessões anteriores são encerradas.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/auth/password/forgot:
    post:
      operationId: requestPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Pedido aceito, exista ou não uma conta com o e-mail.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/admin/auth/password/reset:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Senha redefinida.
        default:
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Erro no formato ProblemDetail.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName:
          type: string
        parameterName:
          type: string
        token:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    AdminAccount:
      type: object
      required: [id, fullName, email, role, permissions, passwordChangeRequired]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
        permissions:
          type: array
          items:
            type: string
            enum: [MANAGE_ACCESS, MANAGE_SPACES]
        passwordChangeRequired:
          type: boolean
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationError'
    FieldValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
